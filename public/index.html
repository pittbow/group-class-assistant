<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="團課小幫手" />
  <link rel="manifest" href="/manifest.json" />
  <title>團課小幫手</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --surface2: #2d3a4f;
      --orange:   #f97316;
      --orange-d: #ea6b0a;
      --blue:     #38bdf8;
      --green:    #34d399;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --border:   #334155;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      padding: 16px 16px env(safe-area-inset-top, 0);
      padding-top: calc(16px + env(safe-area-inset-top, 0));
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--orange);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* ── Type toggle ── */
    .type-toggle {
      display: flex;
      gap: 6px;
    }
    .type-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
    }
    .type-btn.active-飛輪     { background: var(--orange); border-color: var(--orange); color: #fff; }
    .type-btn.active-拳擊有氧 { background: var(--blue);   border-color: var(--blue);   color: #0f172a; }
    .type-btn.active-全部     { background: var(--surface2); border-color: var(--border); color: var(--text); }

    /* ── Region / Branch selects ── */
    .selects-row {
      display: grid;
      grid-template-columns: 1fr 1.6fr auto;
      gap: 8px;
    }
    #favBtn {
      width: 40px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
    }
    #favBtn.on { color: #fbbf24; border-color: #fbbf24; }
    #favBtn:disabled { opacity: .35; cursor: default; }

    /* ── Favorite branches ── */
    #favRow { display: none; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 2px; }
    #favRow.show { display: flex; }
    .fav-chip {
      flex: none;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: .8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .fav-chip.active { border-color: #fbbf24; color: #fbbf24; }

    /* ── Day / time-of-day filters ── */
    .filters { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 14px; }
    .chip-group { display: flex; gap: 6px; }
    .chip {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .chip.active { background: var(--surface2); border-color: var(--orange); color: var(--text); }
    .class-card.past { opacity: .4; }
    select {
      background: var(--surface2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: .88rem;
      outline: none;
      width: 100%;
      cursor: pointer;
      font-family: inherit;
    }
    select:focus { border-color: var(--orange); }

    /* ── Keyword search ── */
    #kwInput {
      width: 100%;
      margin-top: 8px;
      background: var(--surface2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: .88rem;
      outline: none;
      font-family: inherit;
    }
    #kwInput:focus { border-color: var(--orange); }
    #kwInput::placeholder { color: var(--muted); }

    /* ── Main ── */
    main {
      flex: 1;
      padding: 16px;
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0));
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    /* ── Search button ── */
    #searchBtn {
      width: 100%;
      padding: 13px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background .2s;
    }
    #searchBtn:hover:not(:disabled) { background: var(--orange-d); }
    #searchBtn:disabled { opacity: .6; cursor: not-allowed; }

    /* ── States ── */
    .state {
      text-align: center;
      padding: 60px 16px;
      color: var(--muted);
    }
    .state-icon { font-size: 3rem; margin-bottom: 12px; }
    .state h3 { font-size: 1rem; margin-bottom: 6px; color: var(--text); }
    .state p  { font-size: .85rem; line-height: 1.6; }

    /* ── Cache info bar ── */
    #cacheBar {
      display: none;
      background: var(--surface2);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: .78rem;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #refreshBtn {
      background: none;
      border: none;
      color: var(--orange);
      cursor: pointer;
      font-size: .78rem;
      font-weight: 600;
    }

    /* ── Day groups ── */
    .day-group { margin-bottom: 20px; }
    .day-label {
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .day-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .today-badge {
      background: var(--orange);
      color: #fff;
      font-size: .65rem;
      padding: 1px 6px;
      border-radius: 8px;
    }

    /* ── Class card ── */
    .class-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: border-color .2s;
    }
    .class-card:active { border-color: var(--orange); }

    .class-type-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .dot-飛輪     { background: var(--orange); }
    .dot-拳擊有氧 { background: var(--blue); }
    .dot-其他     { background: var(--muted); }

    .class-info { flex: 1; min-width: 0; }
    .class-name {
      font-size: .97rem;
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .class-meta {
      font-size: .8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .class-meta span { display: flex; align-items: center; gap: 3px; }

    .class-time {
      text-align: right;
      flex-shrink: 0;
    }
    .time-start { font-size: 1rem; font-weight: 700; color: var(--orange); }
    .time-end   { font-size: .78rem; color: var(--muted); }

    /* ── Spinner ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty result ── */
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: .9rem;
    }

    /* ── Install hint ── */
    #installHint {
      display: none;
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0));
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
      font-size: .82rem;
      color: var(--text);
      text-align: center;
      max-width: 320px;
      width: calc(100% - 32px);
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      z-index: 200;
    }
    #installHint strong { color: var(--orange); }
    #installClose {
      position: absolute;
      top: 8px; right: 10px;
      background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1rem;
    }

    /* ── 2026 UI refresh ── */
    :root {
      --bg: #0b1220;
      --surface: #151f30;
      --surface2: #202d41;
      --surface3: #29384f;
      --border: #2b3a50;
      --orange: #ff7a1a;
      --orange-d: #ec6808;
      --violet: #a78bfa;
      --pink: #f472b6;
      --shadow: 0 12px 32px rgba(0, 0, 0, .18);
    }
    body {
      background:
        radial-gradient(circle at 50% -160px, rgba(249, 115, 22, .14), transparent 360px),
        var(--bg);
    }
    header {
      padding: calc(12px + env(safe-area-inset-top, 0)) 16px 12px;
      background: rgba(21, 31, 48, .94);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .16);
    }
    .header-inner, main { max-width: 960px; margin-inline: auto; }
    .header-top { margin-bottom: 10px; }
    .logo { font-size: 1.08rem; }
    .logo-icon {
      background: linear-gradient(145deg, #ff9138, #f15b0a);
      box-shadow: 0 7px 18px rgba(249, 115, 22, .26);
    }
    .brand-copy small { display: block; margin-top: 1px; color: var(--muted); font-size: .69rem; font-weight: 500; }
    .selects-row { grid-template-columns: minmax(0, .9fr) minmax(0, 1.5fr) 44px; }
    select, #kwInput {
      min-height: 44px;
      border-radius: 12px;
      border-color: transparent;
      background: var(--surface2);
    }
    #kwInput { padding-left: 14px; }
    #favBtn { width: 44px; min-height: 44px; border-radius: 12px; border-color: transparent; }
    .fav-chip { min-height: 36px; }
    main { max-width: 960px; padding: 18px 16px 32px; }
    #searchBtn {
      min-height: 48px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 9px 22px rgba(249, 115, 22, .22);
    }
    .quick-tools { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-bottom: 12px; }
    .quick-tools #dayChips { min-width: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .quick-tools .chip { min-width: 0; min-height: 40px; }
    #filterToggle {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      white-space: nowrap;
      cursor: pointer;
    }
    #filterCount {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      margin-left: 5px;
      padding: 0 5px;
      border-radius: 9px;
      background: var(--orange);
      color: #fff;
      font-size: .67rem;
    }
    #filterCount:empty { display: none; }
    .filter-panel {
      display: none;
      margin-bottom: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .filter-panel.open { display: grid; gap: 14px; }
    .filter-section { display: grid; gap: 7px; }
    .filter-label { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .06em; }
    .filter-panel .chip-group, .filter-panel .type-toggle { overflow-x: auto; padding-bottom: 2px; }
    .filter-panel .chip, .filter-panel .type-btn { min-height: 36px; flex: 0 0 auto; }
    .chip { border-color: transparent; background: rgba(255,255,255,.025); }
    .chip.active { background: rgba(249,115,22,.13); border-color: rgba(249,115,22,.75); color: #fff; }
    #querySummary {
      display: none;
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid rgba(249, 115, 22, .32);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(249,115,22,.17), rgba(30,41,59,.76) 66%);
      box-shadow: var(--shadow);
    }
    #querySummary.show { display: block; }
    .summary-eyebrow { color: #fdba74; font-size: .74rem; font-weight: 700; margin-bottom: 5px; }
    .summary-title { font-size: 1.22rem; line-height: 1.3; font-weight: 800; }
    .summary-next { margin-top: 7px; color: var(--muted); font-size: .82rem; }
    .summary-next strong { color: var(--text); }
    #cacheBar { border: 1px solid var(--border); background: rgba(32,45,65,.72); }
    .day-group { margin-bottom: 24px; }
    .day-label { position: sticky; top: 144px; z-index: 10; padding: 7px 2px; background: rgba(11,18,32,.92); backdrop-filter: blur(8px); }
    .class-card {
      min-height: 82px;
      padding: 12px 14px 12px 0;
      border-color: rgba(51,65,85,.72);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,.10);
      gap: 0;
    }
    .class-card:hover { border-color: rgba(249,115,22,.48); transform: translateY(-1px); }
    .class-card.past { opacity: 1; background: rgba(21,31,48,.52); color: var(--muted); box-shadow: none; }
    .class-card.past .class-time, .class-card.past .class-name { color: var(--muted); }
    .class-card.next-class { border-left: 3px solid var(--orange); box-shadow: 0 8px 24px rgba(249,115,22,.10); }
    .class-time {
      order: -1;
      width: 78px;
      padding: 2px 12px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .class-info { padding-left: 14px; }
    .time-start { font-size: 1.08rem; }
    .class-name-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .class-name { flex: 1; margin-bottom: 4px; font-size: 1rem; }
    .course-badge {
      flex: none;
      padding: 2px 7px;
      border-radius: 7px;
      font-size: .64rem;
      font-weight: 750;
      letter-spacing: .02em;
    }
    .badge-cycle { color: #fdba74; background: rgba(249,115,22,.14); }
    .badge-boxing { color: #7dd3fc; background: rgba(56,189,248,.13); }
    .badge-other { color: #c4b5fd; background: rgba(167,139,250,.13); }
    .class-type-dot { display: none; }
    .class-meta { gap: 6px 10px; }
    .class-meta .branch-meta { color: #fdba74; }
    .empty, .state { border: 1px dashed var(--border); border-radius: 18px; background: rgba(21,31,48,.34); }

    @media (min-width: 760px) {
      header { padding-inline: 24px; }
      main { padding-inline: 24px; }
      .filter-panel.open { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #content { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; column-gap: 16px; }
      .state, .empty { grid-column: 1 / -1; }
    }
    @media (max-width: 520px) {
      .brand-copy small { display: none; }
      .selects-row { grid-template-columns: minmax(92px,.82fr) minmax(0,1.45fr) 44px; }
      .selects-row select { font-size: .82rem; }
      .quick-tools { align-items: stretch; gap: 7px; }
      .quick-tools .chip { padding-inline: 8px; }
      #filterToggle { padding-inline: 11px; }
      .day-label { top: 138px; }
      .class-time { width: 70px; padding-inline: 9px; }
      .class-info { padding-left: 11px; }
      .course-badge { display: none; }
      .class-meta { font-size: .75rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon">動</div>
        <div class="brand-copy"><span>團課小幫手</span><small>Fitness Factory 課表查詢</small></div>
      </div>
    </div>
    <div id="favRow"></div>
    <div class="selects-row">
      <select id="regionSel" aria-label="選擇縣市" onchange="onRegionChange()">
        <option value="">選擇縣市</option>
      </select>
      <select id="branchSel" aria-label="選擇分店" onchange="updateFavBtn()">
        <option value="">選擇分店</option>
      </select>
      <button id="favBtn" onclick="toggleFav()" title="收藏這間分店" aria-label="收藏這間分店" disabled>☆</button>
    </div>
    <input id="kwInput" type="search" aria-label="搜尋課程、教練、教室或分店" placeholder="搜尋課程、教練、教室或分店…" autocomplete="off" oninput="onKeyword()">
  </div>
</header>

<main>
  <button id="searchBtn" onclick="search()">
    <span id="searchBtnText">🔍 查詢課表</span>
  </button>

  <div class="quick-tools">
    <div class="chip-group" id="dayChips">
      <button class="chip active" data-v="week"     onclick="setDayMode('week')">全部</button>
      <button class="chip"        data-v="today"    onclick="setDayMode('today')">今天</button>
      <button class="chip"        data-v="tomorrow" onclick="setDayMode('tomorrow')">明天</button>
    </div>
    <button id="filterToggle" onclick="toggleFilters()" aria-expanded="false" aria-controls="filterPanel">篩選<span id="filterCount"></span></button>
  </div>

  <div id="filterPanel" class="filter-panel">
    <div class="filter-section">
      <div class="filter-label">搜尋範圍</div>
      <div class="chip-group" id="rangeChips" title="搜尋範圍（官網約公布 4 週）">
        <button class="chip active" data-v="1" onclick="setRange(1)">本週</button>
        <button class="chip" data-v="2" onclick="setRange(2)">2 週</button>
        <button class="chip" data-v="4" onclick="setRange(4)">4 週</button>
        <button class="chip" data-v="6" onclick="setRange(6)">全部公布</button>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-label">課程類型</div>
      <div class="type-toggle">
        <button class="type-btn active-全部" data-type="全部" onclick="setType('全部')">全部</button>
        <button class="type-btn" data-type="飛輪" onclick="setType('飛輪')">飛輪</button>
        <button class="type-btn" data-type="拳擊有氧" onclick="setType('拳擊有氧')">拳擊／格鬥</button>
      </div>
    </div>
    <div class="filter-section">
      <div class="filter-label">上課時段</div>
      <div class="chip-group" id="periodChips">
        <button class="chip active" data-v="all" onclick="setPeriod('all')">全天</button>
        <button class="chip" data-v="am" onclick="setPeriod('am')">早上</button>
        <button class="chip" data-v="pm" onclick="setPeriod('pm')">下午</button>
        <button class="chip" data-v="eve" onclick="setPeriod('eve')">晚上</button>
      </div>
    </div>
  </div>

  <section id="querySummary" aria-live="polite"></section>

  <div id="cacheBar" style="display:none">
    <span id="cacheTime"></span>
    <button id="refreshBtn" onclick="refresh()">重新抓取</button>
  </div>

  <div id="content">
    <div class="state">
      <div class="state-icon">🏋️</div>
      <h3>選擇分店查詢課表</h3>
      <p>支援健身工廠全台分店<br>飛輪課程與拳擊有氧課程</p>
    </div>
  </div>
</main>

<!-- PWA 安裝提示 -->
<div id="installHint">
  <button id="installClose" onclick="document.getElementById('installHint').style.display='none'">✕</button>
  <strong>加到手機桌面</strong><br>
  點選瀏覽器選單 → <strong>「加入主畫面」</strong><br>即可像 APP 一樣使用
</div>

<script>
  // ─── State ────────────────────────────────────────────────────────────────

  let branches = [];
  let currentType = '全部';
  let lastResult  = null;
  const ALL_BRANCHES = '*'; // 分店選單的「該縣市全部分店」

  // 與 scraper.js 的 CYCLE_RE / BOXING_RE 保持一致
  const CYCLE_RE  = /飛輪|cycle|循環/i;
  const BOXING_RE = /拳擊|boxing|武力對決|戰鬥|combat/i;

  const WEEKDAY_NAMES = ['週日','週一','週二','週三','週四','週五','週六'];
  const todayIdx = () => new Date().getDay();        // 每次重新取，App 開著跨日也正確
  const nowMinutes = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const pad2 = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;   // 本機時區
  const todayStr = () => ymd(new Date());
  const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate() + 1); return ymd(d); };
  const dateToIdx = str => { const [y, m, d] = str.split('-').map(Number); return new Date(y, m - 1, d).getDay(); };
  const toMinutes = t => { const m = (t || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };

  let weeks   = 1;        // 搜尋範圍（週數）：1 本週 / 2 / 4 / 6 全部公布
  let dayMode = 'week';   // 'week' | 'today' | 'tomorrow'
  let period  = 'all';    // 'all' | 'am'(<12:00) | 'pm'(12:00–17:00) | 'eve'(17:00 後)

  // ─── Init ─────────────────────────────────────────────────────────────────

  async function init() {
    await loadBranches();
    registerSW();
    renderFavs();
    updateFilterCount();
    openStartBranch();

    // PWA 安裝提示（iOS 上無 beforeinstallprompt）
    const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
    const isStandalone = navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (isIos && !isStandalone) {
      setTimeout(() => { document.getElementById('installHint').style.display = 'block'; }, 3000);
    }
  }

  async function loadBranches() {
    try {
      const res = await fetch('/api/branches');
      branches  = await res.json();
      renderRegions();
    } catch (e) {
      console.error('載入分店失敗', e);
    }
  }

  // ─── Dropdowns ────────────────────────────────────────────────────────────

  function renderRegions() {
    const sel = document.getElementById('regionSel');
    sel.innerHTML = '<option value="">選擇縣市</option>';
    branches.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.region;
      opt.textContent = r.region;
      sel.appendChild(opt);
    });
  }

  function onRegionChange() {
    const region   = document.getElementById('regionSel').value;
    const branchSel = document.getElementById('branchSel');
    branchSel.innerHTML = '<option value="">選擇分店</option>';
    updateFavBtn();

    if (!region) return;
    const found = branches.find(r => r.region === region);
    if (!found) return;

    if (found.branches.length > 1) {
      const all = document.createElement('option');
      all.value = ALL_BRANCHES;
      all.textContent = `📍 全部分店（${found.branches.length} 間）`;
      branchSel.appendChild(all);
    }

    found.branches.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b;
      opt.textContent = b;
      branchSel.appendChild(opt);
    });
  }

  // ─── 今天／明天、時段 ─────────────────────────────────────────────────────

  function setChip(groupId, value) {
    document.querySelectorAll(`#${groupId} .chip`).forEach(b => b.classList.toggle('active', b.dataset.v === value));
  }
  function toggleFilters() {
    const panel = document.getElementById('filterPanel');
    const open = panel.classList.toggle('open');
    document.getElementById('filterToggle').setAttribute('aria-expanded', String(open));
  }
  function updateFilterCount() {
    const count = (weeks !== 1 ? 1 : 0) + (currentType !== '全部' ? 1 : 0) + (period !== 'all' ? 1 : 0);
    document.getElementById('filterCount').textContent = count ? String(count) : '';
  }
  function setRange(v) {
    weeks = v;
    setChip('rangeChips', String(v));
    updateFilterCount();
    if (document.getElementById('branchSel').value) search();   // 範圍改變需重新向伺服器取資料
  }
  function setDayMode(v) { dayMode = v; setChip('dayChips', v);    if (lastResult) renderSchedule(lastResult, currentType); }
  function setPeriod(v)  { period  = v; setChip('periodChips', v); updateFilterCount(); if (lastResult) renderSchedule(lastResult, currentType); }

  // ─── 收藏分店（存在這支手機的 localStorage，不需登入）──────────────────────

  const store = {
    get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const getFavs = () => store.get('gca:favs', []);
  const currentSel = () => ({ region: document.getElementById('regionSel').value, branch: document.getElementById('branchSel').value });
  const isFav = (r, b) => getFavs().some(f => f.region === r && f.branch === b);

  function updateFavBtn() {
    const { region, branch } = currentSel();
    const btn = document.getElementById('favBtn');
    const specific = !!branch && branch !== ALL_BRANCHES;
    const on = specific && isFav(region, branch);
    btn.disabled = !specific;
    btn.classList.toggle('on', on);
    btn.textContent = on ? '★' : '☆';
    btn.title = on ? '取消收藏' : '收藏這間分店';
    renderFavs();
  }

  function toggleFav() {
    const { region, branch } = currentSel();
    if (!branch || branch === ALL_BRANCHES) return;
    const favs = getFavs();
    const i = favs.findIndex(f => f.region === region && f.branch === branch);
    if (i >= 0) favs.splice(i, 1);
    else if (favs.length >= 8) { showToast('最多收藏 8 間分店'); return; }
    else favs.push({ region, branch });
    store.set('gca:favs', favs);
    updateFavBtn();
  }

  function renderFavs() {
    const row = document.getElementById('favRow');
    const favs = getFavs();
    const { region, branch } = currentSel();
    row.classList.toggle('show', favs.length > 0);
    row.innerHTML = favs.map((f, i) =>
      `<button class="fav-chip${f.region === region && f.branch === branch ? ' active' : ''}" onclick="openFav(${i})">★ ${escapeHtml(f.branch)}</button>`
    ).join('');
  }

  function openFav(i) {
    const f = getFavs()[i];
    if (f) selectBranch(f.region, f.branch);
  }

  function selectBranch(region, branch) {
    const regionSel = document.getElementById('regionSel');
    regionSel.value = region;
    onRegionChange();
    const branchSel = document.getElementById('branchSel');
    branchSel.value = branch;
    if (branchSel.value !== branch) return false;   // 官網已無此分店
    updateFavBtn();
    search();
    return true;
  }

  // 開啟 App 時直接顯示：上次看的分店（若已收藏），否則第一個收藏
  function openStartBranch() {
    const favs = getFavs();
    if (!favs.length) return;
    const last = store.get('gca:last', null);
    const order = [last && favs.find(f => f.region === last.region && f.branch === last.branch), ...favs].filter(Boolean);
    for (const f of order) if (selectBranch(f.region, f.branch)) return;
  }

  // ─── Type toggle ──────────────────────────────────────────────────────────

  function setType(type) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(btn => {
      btn.className = 'type-btn' + (btn.dataset.type === type ? ` active-${type}` : '');
    });
    updateFilterCount();
    // 如果已有結果，重新渲染篩選
    if (lastResult) renderSchedule(lastResult, type);
  }

  // ─── Search ───────────────────────────────────────────────────────────────

  async function search() {
    const branch = document.getElementById('branchSel').value;
    if (!branch) { showToast('請先選擇分店'); return; }
    const region = document.getElementById('regionSel').value;

    setLoading(true);
    document.getElementById('cacheBar').style.display = 'none';

    try {
      // 一律取全部課程，類型與關鍵字由前端篩選，切換時不必重查
      const url = branch === ALL_BRANCHES
        ? `/api/region-schedule?region=${encodeURIComponent(region)}&weeks=${weeks}`
        : `/api/schedule?branch=${encodeURIComponent(branch)}&type=${encodeURIComponent('全部')}&weeks=${weeks}`;
      const res  = await fetch(url);
      const data = await res.json();

      if (!res.ok) throw new Error(data.error || '查詢失敗');

      lastResult = data;
      renderSchedule(data, currentType);
      if (branch !== ALL_BRANCHES) store.set('gca:last', { region, branch });

      // 顯示快取時間
      if (data.fetchedAt) {
        const cacheBar = document.getElementById('cacheBar');
        cacheBar.style.display = 'flex';
        document.getElementById('cacheTime').textContent =
          `資料時間：${new Date(data.fetchedAt).toLocaleString('zh-TW', { month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit' })}`
          + (data.failed && data.failed.length ? `（載入失敗：${data.failed.join('、')}）` : '');
      }
    } catch (err) {
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  async function refresh() {
    const branch = document.getElementById('branchSel').value;
    if (!branch) return;
    await fetch('/api/refresh', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(branch === ALL_BRANCHES
        ? { region: document.getElementById('regionSel').value }
        : { branch, type: '全部' })
    });
    await search();
  }

  // ─── Render schedule ──────────────────────────────────────────────────────

  function renderSchedule(data, type) {
    const content = document.getElementById('content');

    let classes = data.classes || [];
    const kw = getKeyword();

    // 前端再過濾
    if (type !== '全部') {
      classes = classes.filter(c => {
        const name = c.name || '';
        if (type === '飛輪')    return CYCLE_RE.test(name);
        if (type === '拳擊有氧') return BOXING_RE.test(name);
        return false;
      });
    }

    // 關鍵字篩選（課名／教練／教室，空白分隔視為「且」）
    if (kw.length) {
      classes = classes.filter(c => {
        const hay = `${c.name || ''} ${c.instructor || ''} ${c.location || ''} ${c.branch || ''}`.toLowerCase();
        return kw.every(k => hay.includes(k));
      });
    }

    // 時段篩選（依開始時間）
    if (period !== 'all') {
      classes = classes.filter(c => {
        const m = toMinutes(c.time);
        if (m == null) return false;
        return period === 'am' ? m < 12 * 60 : period === 'pm' ? m >= 12 * 60 && m < 17 * 60 : m >= 17 * 60;
      });
    }

    // 今天／明天；「今天」會隱藏已經下課的課
    const today = todayStr();
    const sundayTomorrow = dayMode === 'tomorrow' && weeks === 1 && todayIdx() === 0;  // 明天是下週一，不在「本週」範圍內
    if (dayMode === 'today') {
      const now = nowMinutes();
      classes = classes.filter(c => getDate(c) === today && (toMinutes(c.endTime || c.time) ?? 0) >= now);
    } else if (dayMode === 'tomorrow') {
      const tomorrow = tomorrowStr();
      classes = classes.filter(c => getDate(c) === tomorrow);
    } else if (weeks > 1) {
      classes = classes.filter(c => getDate(c) >= today);   // 跨週搜尋：只看今天起的課，過去的日子不顯示
    }

    if (classes.length === 0) {
      renderSummary([], data);
      const filtered = kw.length || period !== 'all' || dayMode !== 'week';
      const title = sundayTomorrow ? '明天是下週一，不在「本週」範圍內'
        : kw.length ? `找不到符合「${escapeHtml(kw.join(' '))}」的課程`
        : dayMode === 'today' ? '今天沒有符合的課程了'
        : filtered ? '沒有符合條件的課程'
        : weeks > 1 ? '這段期間官網尚未公布課程' : '本週暫無相關課程資料';
      const hint = sundayTomorrow ? '把上方範圍改成「2 週」以上就能看到'
        : filtered ? '可放寬關鍵字、時段或日期條件'
        : '可嘗試切換「全部」課程類型，或改選其他分店';
      content.innerHTML = `
        <div class="empty">
          <div style="font-size:2.5rem;margin-bottom:12px">🔍</div>
          <div>${title}</div>
          <div style="font-size:.8rem;margin-top:6px;color:var(--muted)">${hint}</div>
        </div>`;
      return;
    }

    const nextClassKey = getNextClassKey(classes);
    renderSummary(classes, data, nextClassKey);

    // 按日期分組（跨週時每天各一組）
    const grouped = groupByDate(classes);

    let html = '';
    for (const date of Object.keys(grouped).sort()) {
      const items = grouped[date];

      const isToday  = date === today;
      const [, mm, dd] = date.split('-').map(Number);
      const dayLabel = `${WEEKDAY_NAMES[dateToIdx(date)]} ${mm}/${dd}`;

      html += `<div class="day-group">
        <div class="day-label">
          ${dayLabel}${isToday ? '<span class="today-badge">今天</span>' : ''}
        </div>`;

      for (const cls of items) {
        const dotClass = cls.type === '飛輪' ? 'dot-飛輪' : cls.type === '拳擊有氧' ? 'dot-拳擊有氧' : 'dot-其他';
        const startTime = formatTime(cls.time);
        const endTime   = cls.endTime ? formatTime(cls.endTime) : '';

        const past = isPast(cls);
        const isNext = !past && classKey(cls) === nextClassKey;
        const badgeClass = cls.type === '飛輪' ? 'badge-cycle' : cls.type === '拳擊有氧' ? 'badge-boxing' : 'badge-other';
        const badgeText = cls.type === '拳擊有氧' ? '格鬥' : cls.type;
        html += `
        <div class="class-card${past ? ' past' : ''}${isNext ? ' next-class' : ''}">
          <div class="class-type-dot ${dotClass}"></div>
          <div class="class-info">
            <div class="class-name-row">
              <div class="class-name">${escapeHtml(cls.name || '未知課程')}</div>
              <span class="course-badge ${badgeClass}">${escapeHtml(badgeText)}</span>
            </div>
            <div class="class-meta">
              ${cls.instructor ? `<span>教練 ${escapeHtml(cls.instructor)}</span>` : ''}
              ${cls.location   ? `<span>${escapeHtml(cls.location)}</span>`   : ''}
              ${cls.branch     ? `<span class="branch-meta">${escapeHtml(cls.branch)}廠</span>` : ''}
              ${cls.spots != null ? `<span>${escapeHtml(String(cls.spots))} 位</span>` : ''}
            </div>
          </div>
          <div class="class-time">
            <div class="time-start">${startTime}</div>
            ${endTime ? `<div class="time-end">${endTime}</div>` : ''}
          </div>
        </div>`;
      }
      html += '</div>';
    }

    content.innerHTML = html || `<div class="empty">本週暫無課程資料</div>`;
  }

  // ─── Helpers ──────────────────────────────────────────────────────────────

  function classKey(cls) {
    return [getDate(cls), cls.time || '', cls.branch || '', cls.name || '', cls.instructor || ''].join('|');
  }

  function getNextClassKey(classes) {
    const today = todayStr();
    const now = nowMinutes();
    const upcoming = classes
      .filter(c => getDate(c) > today || (getDate(c) === today && (toMinutes(c.time) ?? -1) >= now))
      .sort((a, b) => getDate(a).localeCompare(getDate(b)) || (a.time || '').localeCompare(b.time || ''));
    return upcoming.length ? classKey(upcoming[0]) : '';
  }

  function renderSummary(classes, data, nextKey = '') {
    const box = document.getElementById('querySummary');
    if (!classes.length) {
      box.classList.remove('show');
      box.innerHTML = '';
      return;
    }

    const region = document.getElementById('regionSel').value;
    const branch = document.getElementById('branchSel').value;
    const place = branch === ALL_BRANCHES
      ? `${region} · ${data.branchCount || ''} 間分店`
      : `${branch}廠`;
    const range = weeks === 1 ? '本週' : weeks === 6 ? '全部已公布課表' : `未來 ${weeks} 週`;
    const next = nextKey ? classes.find(c => classKey(c) === nextKey) : null;
    const nextText = next
      ? `下一堂 <strong>${formatSummaryDate(getDate(next))} ${formatTime(next.time)} · ${escapeHtml(next.name || '未知課程')}</strong>${next.branch ? ` · ${escapeHtml(next.branch)}廠` : ''}`
      : '目前篩選結果中沒有尚未開始的課程';

    box.innerHTML = `
      <div class="summary-eyebrow">${escapeHtml(place)} · ${escapeHtml(range)}</div>
      <div class="summary-title">找到 ${classes.length} 堂課</div>
      <div class="summary-next">${nextText}</div>`;
    box.classList.add('show');
  }

  function formatSummaryDate(date) {
    if (date === todayStr()) return '今天';
    if (date === tomorrowStr()) return '明天';
    const [, m, d] = date.split('-').map(Number);
    return `${m}/${d} ${WEEKDAY_NAMES[dateToIdx(date)]}`;
  }

  function getKeyword() {
    return document.getElementById('kwInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  let kwTimer;
  function onKeyword() {
    clearTimeout(kwTimer);
    kwTimer = setTimeout(() => { if (lastResult) renderSchedule(lastResult, currentType); }, 150);
  }

  // 課程日期（YYYY-MM-DD）；伺服器一律附帶 date，缺少時以「本週的該星期」推算
  function getDate(cls) {
    if (cls.date) return cls.date;
    const idx = WEEKDAY_NAMES.indexOf(cls.weekday);
    if (idx === -1) return todayStr();
    const d = new Date();
    d.setDate(d.getDate() + (idx - d.getDay()));
    return ymd(d);
  }

  // 已經過去：日期早於今天，或今天已下課
  function isPast(cls) {
    const date = getDate(cls), today = todayStr();
    if (date !== today) return date < today;
    return (toMinutes(cls.endTime || cls.time) ?? 24 * 60) < nowMinutes();
  }

  function groupByDate(classes) {
    const groups = {};
    classes.forEach(cls => {
      const date = getDate(cls);
      (groups[date] = groups[date] || []).push(cls);

      // 判斷課程類型
      const name = cls.name || '';
      cls.type = CYCLE_RE.test(name) ? '飛輪' : BOXING_RE.test(name) ? '拳擊有氧' : '其他';
    });

    // 每天按時間排序
    Object.keys(groups).forEach(day => {
      groups[day].sort((a, b) => (a.time || '').localeCompare(b.time || '') || (a.branch || '').localeCompare(b.branch || ''));
    });

    return groups;
  }

  function formatTime(time) {
    if (!time) return '';
    const m = time.match(/(\d{1,2}):(\d{2})/);
    if (!m) return time;
    return `${m[1].padStart(2,'0')}:${m[2]}`;
  }

  function setLoading(loading) {
    const btn  = document.getElementById('searchBtn');
    const text = document.getElementById('searchBtnText');
    btn.disabled = loading;
    text.innerHTML = loading
      ? '<div class="spinner"></div> 載入中…'
      : '🔍 查詢課表';
  }

  function showError(msg) {
    renderSummary([], {});
    document.getElementById('content').innerHTML = `
      <div class="state">
        <div class="state-icon">⚠️</div>
        <h3>查詢失敗</h3>
        <p>${msg}</p>
      </div>`;
  }

  let toastTimer;
  function showToast(msg) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#f1f5f9;padding:10px 20px;border-radius:8px;font-size:.85rem;z-index:300;border:1px solid #334155;transition:opacity .3s;';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
  }

  function registerSW() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW:', e));
    }
  }

  init();
</script>
</body>
</html>
